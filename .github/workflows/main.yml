name: Public artifact checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements.txt
      - run: make test-tools
